name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Descargar y convertir textos biblicos
        run: python scripts/build_data.py app/src/main/assets

      - name: Calendario de parashot (Hebcal)
        continue-on-error: true
        run: python scripts/parashot.py app/src/main/assets

      - name: Cache de traducciones del lexico
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/lex/H_es.json
            app/src/main/assets/lex/G_es.json
          key: lex-es-v1-${{ hashFiles('scripts/translate_lex.py') }}

      - name: Traducir lexico al espanol
        continue-on-error: true
        run: |
          pip install ctranslate2 sentencepiece
          python scripts/translate_lex.py app/src/main/assets

      - name: Fuente hebrea (opcional)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL "https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoSerifHebrew/hinted/ttf/NotoSerifHebrew-Regular.ttf" -o app/src/main/assets/fonts/HebrewSerif.ttf || true

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }

      - name: Compilar
        run: gradle assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk BibliaRaices.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BibliaRaices-apk
          path: BibliaRaices.apk

      - name: Publicar APK (link fijo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Biblia Raíces v${{ github.run_number }}
          files: BibliaRaices.apk
          make_latest: true
